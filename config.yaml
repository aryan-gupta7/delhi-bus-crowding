# Single source of every parameter (design/mechanism.md §8, design/business-logic.md §12).
# Nothing in the package hard-codes a date, route name, stop name or threshold.
seed: 20261124

paths:
  tickets: data/October-Delhi.csv
  gtfs: data/gtfs
  out: out

eligibility:                 # S0b, mechanism.md S0 (G1 is a regression test of these values)
  mask_ratio: 0.65           # P-M1
  holiday_ratio: 0.70        # P-M2
  stream_fault_ratio: 0.75   # P-M13
  min_median: 100            # P-M12

gtfs:                        # S1
  stretch_min_len_m: 800     # P-M3a
  stretch_max_segments: 4    # P-M3b
  min_offset_trips: 3        # trips containing stop 0 needed for median offsets
  min_tau_min: 0.5

matching:                    # S2
  fuzzy_score: 85            # P-M4 (token-set ratio, 0-100)
  fuzzy_margin: 5            # best must beat second-best by this many points
  coord_radius_m: 500        # P-M5
  abbreviations:             # token-wise, applied after case-folding (A-note: reviewed by hand)
    bdr: border
    sec: sector
    ext: extension
    xing: crossing
    nd: new delhi
    stn: station
    rly: railway
    rd: road
    mkt: market
    apt: apartment
    apts: apartments
    opp: opposite
    nr: near
    govt: government
    hosp: hospital
    univ: university
    dep: depot
    colony: colony

flows:                       # S3
  gamma: 1.0                 # P-M7 actual/scheduled speed ratio

supply:                      # S4
  seats: {ac: 39, non_ac: 35}   # A-9, [S]-sourced, flagged in outputs as default_seats
  weekend_omega: 1.0         # P-M9 default (no-op for within-day-type levels)

estimator:                   # S5
  hour_bands:                # P-M10: band name -> list of hours
    am: [6, 7, 8, 9]
    mid: [10, 11, 12, 13, 14, 15]
    pm: [16, 17, 18, 19]
    eve: [20, 21, 22]
    night: [23, 0, 1, 2, 3, 4, 5]
  group_shrink: 50           # P-M15
  min_pairs: 20              # P-M16
  length_classes: 5          # quintiles of pattern length for the OD fallback
  length_grid: 10            # normalised-position grid for the length-class OD profile
  radial_min_diff_km: 3.0    # route is radial if first/last stop differ this much in distance to centroid
  centroid: [28.6329, 77.2195]   # Connaught Place (lat, lon)
  min_hour_cells: 5          # min cells with data to fit alpha / phi

index:                       # S6
  p_r1: 50                   # level 1/2 boundary percentile
  p_r2: 85                   # level 2/3 boundary percentile

ensemble:                    # S7
  k: 33                      # P-M11: multiple of 3, theta stratified
  theta_grid: [-0.4, -0.2, 0.0]   # P-M17
  theta_central: -0.2
  sigma_r: 0.4               # A-10 (V9 also runs 0.9)
  robust_share: 0.8          # P-R4

tiers:                       # business-logic.md §4
  high:   {min_tickets: 100, max_cv: 0.25}
  medium: {min_tickets: 30,  max_cv: 0.5}
  low:    {min_tickets: 8}
  min_route_coverage: 0.25   # P-R11
  small_n: 2                 # cells with N <= this are capped at Medium

validation:                  # §9
  train_days: 11
  tier_edges: [10, 75]       # tickets/cell-week: <10, 10-74, >=75
  min_rank_cells: 1000
  add_k: 0.5

planner:                     # business-logic.md §8
  walk_radius_m: 400         # P-R9
  walk_speed_mps: 1.2
  walk_detour: 1.3
  min_transfer_min: 3
  max_routes_per_stop: 60
  max_candidates: 40
  multipliers: [1.0, 1.5, 2.3]   # P-R3 (ordinal penalties)
  extra_time_min: 15         # P-R12
  extra_time_frac: 0.40      # P-R13
  min_advantage_min: 5       # P-R14
  min_advantage_frac: 0.10
  overall_leg_share: 0.25    # P-R15
  gamma_max: 10.0            # P-R16
