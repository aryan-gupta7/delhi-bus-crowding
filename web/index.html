<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Delhi bus crowding</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Geist+Mono:wght@500&family=Noto+Sans+Devanagari:wght@400;500&display=swap">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <span class="mark" aria-hidden="true"><i class="p" style="zoom:.8"></i><i class="p"></i><i class="p" style="zoom:1.2"></i></span>
    <span class="dsp" data-i18n="appTitle">Delhi bus crowding</span>
  </div>
  <div class="seg" role="group" aria-label="View" id="seg-view"><button data-view="plan" class="on" aria-pressed="true" data-i18n="viewPlan">Plan a trip</button><button data-view="operator" aria-pressed="false" data-i18n="viewOperator">Operator view</button></div>
  <div class="seg" role="group" id="seg-opday" hidden aria-label="Day type"><button data-day="weekday" class="on" aria-pressed="true" data-i18n="weekday">Weekday</button><button data-day="weekend" aria-pressed="false" data-i18n="weekend">Weekend or holiday</button></div>
  <label class="small mut" id="op-hour-wrap" hidden><span data-i18n="hourOnMap">Hour on map</span> <select class="sel" id="op-hour"></select></label>
  <span class="spacer"></span>
  <div class="seg compact" role="group" id="seg-theme" aria-label="Theme"><button data-theme="auto" class="on" aria-pressed="true" data-i18n="themeAuto">Auto</button><button data-theme="light" aria-pressed="false" data-i18n="themeLight">Light</button><button data-theme="dark" aria-pressed="false" data-i18n="themeDark">Dark</button></div>
  <div class="seg compact" role="group" id="seg-lang" aria-label="Language" style="width:104px"><button data-lang="en" class="on" aria-pressed="true">EN</button><button data-lang="hi" aria-pressed="false">हिं</button></div>
  <button class="lk" id="open-info" data-i18n="howTo">How to read this</button>
</header>

<main id="view-plan" class="layout">
  <aside class="side stack">
    <h1 class="dsp lead" data-i18n="heroTitle">Where to, and when?</h1>
    <p class="sec" style="margin-bottom:8px" data-i18n="heroSub">See where on a bus ride people are usually most crowded.</p>
    <form id="plan-form" autocomplete="off" class="stack">
      <div class="card" style="position:relative">
        <div class="fld"><label for="from" data-i18n="from">From</label><input id="from" list="from-list" required data-i18n-ph="fromPh"></div>
        <datalist id="from-list"></datalist>
        <div style="height:1px;background:var(--bd);margin:0 16px"></div>
        <div class="fld"><label for="to" data-i18n="to">To</label><input id="to" list="to-list" required data-i18n-ph="toPh"></div>
        <datalist id="to-list"></datalist>
        <button type="button" class="ib" id="swap" data-i18n-label="swap" style="position:absolute;right:12px;top:50%;margin-top:-22px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4v16M7 20l-4-4M7 20l4-4M17 20V4M17 4l-4 4M17 4l4 4"/></svg></button>
      </div>
      <div class="row">
        <div class="card fld" style="flex:0 0 220px;border-radius:20px"><label for="time" data-i18n="at" style="width:auto">Leave at</label><input id="time" class="mono" type="time" value="08:57" required style="text-align:right"></div>
        <div class="seg" id="seg-day" role="group" aria-label="Day type" style="flex:1 1 220px"><button type="button" data-day="weekday" class="on" aria-pressed="true" data-i18n="weekday">Weekday</button><button type="button" data-day="weekend" aria-pressed="false" data-i18n="weekend">Weekend or holiday</button></div>
      </div>
      <button class="btn" type="submit"><span data-i18n="show">Show options</span></button>
      <p class="mut small" style="text-align:center" data-i18n="noSignup">No sign-up needed.</p>
    </form>
    <p id="status" role="status" class="small"></p>
    <div id="results" class="stack"></div>
    <div id="examples-wrap" hidden>
      <p class="sec small" style="font-weight:500;margin-bottom:6px" data-i18n="tryPeak">Try a peak trip</p>
      <div class="card" id="examples" style="overflow:hidden;border-radius:20px"></div>
    </div>
    <p id="foot" class="mut tiny"></p>
  </aside>
  <section class="mapwrap" aria-label="Map">
    <div id="map"></div>
    <div class="card legend" id="legend"></div>
    <div class="seg hours" id="seg-hours" role="group" aria-label="Hour on map" hidden></div>
    <p class="sec tiny maplabel" id="maplabel"></p>
  </section>
</main>

<main id="view-op" hidden>
  <div class="opgrid">
    <section class="card" style="flex:999 1 640px">
      <div class="row" style="justify-content:space-between;align-items:center">
        <h2 class="dsp" style="font-size:22px" data-i18n="opTitle">Worst stretch of each route, by hour</h2>
        <div id="op-legend" class="row" style="gap:6px"></div>
      </div>
      <p class="mut small" style="margin-top:4px" data-i18n="opHint"></p>
      <div style="overflow-x:auto;margin-top:14px"><div id="heat" style="min-width:640px"></div></div>
    </section>
    <aside class="card" style="flex:1 1 340px">
      <h2 class="dsp" style="font-size:22px" id="det-title" data-i18n="detail">Stretch detail</h2>
      <div id="det"><p class="mut small" style="margin-top:8px" data-i18n="pickCell"></p></div>
    </aside>
  </div>
  <div class="opgrid">
    <section class="card" style="flex:1 1 560px">
      <h2 class="dsp" style="font-size:20px" data-i18n="overloaded">Usually overloaded stretches</h2>
      <p class="mut small" style="margin-top:4px" data-i18n="overloadedHint"></p>
      <div style="overflow-x:auto;margin-top:10px"><table id="overloaded"></table></div>
    </section>
    <section class="card" style="flex:1 1 440px">
      <h2 class="dsp" style="font-size:20px" data-i18n="reliefTitle">Where one more bus relieves most</h2>
      <p class="mut small" style="margin-top:4px" data-i18n="reliefHint"></p>
      <div id="relief" style="margin-top:12px;display:flex;flex-direction:column;gap:12px"></div>
      <p class="mut tiny" style="margin-top:14px;line-height:1.45" data-i18n="reliefNote"></p>
    </section>
  </div>
  <div class="note small sec"><b style="color:var(--ink);font-weight:500" data-i18n="fairness">Fairness note.</b> <span data-i18n="fairnessText"></span></div>
  <p class="mut small" id="op-foot" style="padding:0 28px 24px"></p>
</main>

<dialog id="info" aria-labelledby="info-title">
  <h2 class="dsp" id="info-title" style="font-size:22px" data-i18n="aboutTitle">How to read this</h2>
  <div id="info-body" style="margin-top:12px;display:flex;flex-direction:column;gap:10px"></div>
  <button class="btn" id="close-info" style="margin-top:16px"><span data-i18n="close">Close</span></button>
</dialog>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="/static/i18n.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
